[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ghand_python_sdk"
version = "2.2.0"
description = "GHand Python SDK"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
    {name = "GLITECH"},
]
requires-python = ">=3.10"
dependencies = [
    "pysoem>=1.0.2,<2.0.0",
    "psutil>=5.9.0",
    "numpy>=1.24.0",
    "pymodbus>=3.0.0,<4.0.0",
    "pyserial>=3.5",
    "numpy-stl>=3.1.0",
    "pandas>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "yapf>=0.40.0",
    "mypy>=1.0.0",
    "pytest>=7.0.0",
    "pre-commit>=3.0.0",
]

[project.urls]
Homepage = "https://github.com/gli-sdk/GHand-Python-SDK"
Gitee = "https://gitee.com/glitech/GHand-Python-SDK"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ghand = [
    "config/*.json",
    "py.typed",
]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
ignore_missing_imports = true
show_error_codes = true
warn_redundant_casts = true
warn_unused_ignores = true
strict_equality = true
