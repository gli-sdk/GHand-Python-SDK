[metadata]
# Project metadata
name = ghand_python_sdk
author = Shenzhen GLI Technology Co., Ltd.
author_email = csi@glitech.com
description = GHand Python SDK for dexterous hand
long_description = file: README.md
long_description_content_type = text/markdown
url = https://github.com/gli-sdk/GHand-Python-SDK
project_urls =
    Gitee = https://gitee.com/glitech/GHand-Python-SDK
license = Apache-2.0
license_files = LICENSE

[options]
# Packaging options
# pyproject.toml is the canonical packaging metadata for new builds.
# Keep install_requires mirrored here only for legacy setuptools entry points.
packages = find:
package_dir =
    = src
python_requires = >=3.10
install_requires =
    pysoem>=0.2.0
    netifaces>=0.11.0
    numpy>=1.24.0
    numpy-stl>=3.1.0
    pandas>=2.0.0
    pymodbus>=3.0.0
    pyserial>=3.5

[options.packages.find]
# Tell find: where to look for packages
where = src
